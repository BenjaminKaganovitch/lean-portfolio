name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject sorry
        shell: bash
        run: |
          if grep -rnw --include='*.lean' sorry LeanPortfolio LeanPortfolio.lean; then
            echo "error: found sorry"
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        shell: bash
        run: lake exe cache get

      - name: Build
        shell: bash
        run: |
          lake build 2>&1 | tee build.log
          if grep -q "declaration uses 'sorry'" build.log; then
            echo "error: build reports sorry"
            exit 1
          fi
